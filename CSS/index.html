<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- we have to link the css file to this inorder to apply changes from external file -->
    <!-- this is called external css -->
    <link rel="stylesheet" href="index.css">

    <!-- internal css it can be outside the body and inside the body as well but it has to be in the file -->
     <style>
        p{
            font-style: italic;
        }
        /* this is tag name selector one of the types of selector which applies to every tag related to the name p */
     </style>
</head>
<body>
    <!-- inline css -->
    <p style="color: chocolate;">Hello CSS</p>
    <p>We want to design html doc</p>
</body>
</html>
