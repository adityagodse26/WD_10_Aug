<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>application</title>
</head>
<body>

    <fieldset>

        <form action="">
        <h1>Registration Form</h1>
        <label for="fullname"><span style="color: red;">*</span>Fullname:</label>
        <input type="text" id="fullname" required>
        
        <br><br>

        <label for="email"><span style="color: red;">*</span>Email:</label>
        <input type="email" id="email" required placeholder="xyz@gmail.com">

        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password">

        <br><br>

        <label for="">DOB:</label>
        <input type="date" id="">

        <br><br>

        <label for="">Age:</label>
        <input type="number" id="">

        <br><br>

        <label for="">Contact:</label>
        <input type="tel">

        <br><br>

        <label for="">course:</label>
        <input type="checkbox">JAVA
        <input type="checkbox">python
        <input type="checkbox">mern
        <input type="checkbox">web

        <br><br>

        <label for="">gender</label>
        <input type="radio" name="gender">Female
        <input type="radio" name="gender">Male

        <br><br>

        <label for="">File:</label>
        <input type="file">

        <br><br>

        <label for="">address:</label>
        <textarea name="" id="" cols="30" rows="10"></textarea>

        <br><br>

        <button>Submit</button>
        <button>Reset</button>

        <!-- we can also use input for button type button and using value we give it name for it -->
    </form>

    </fieldset>
<!-- task enquiry form 2 form minimum-->
</body>
</html>
